{% if page_obj.paginator.num_pages > 1 %}
    <nav class="sms-pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.message_type %}&message_type={{ request.GET.message_type|urlencode }}{% endif %}">Previous</a>
        {% else %}
            <span class="disabled">Previous</span>
        {% endif %}

        <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.message_type %}&message_type={{ request.GET.message_type|urlencode }}{% endif %}">Next</a>
        {% else %}
            <span class="disabled">Next</span>
        {% endif %}
    </nav>
{% endif %}
