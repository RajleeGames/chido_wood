{% if page_obj.paginator.num_pages > 1 %}
<nav class="transport-pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="button button-secondary" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
    {% else %}
        <span class="button button-secondary is-disabled">Previous</span>
    {% endif %}

    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
        <a class="button button-secondary" href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}">Next</a>
    {% else %}
        <span class="button button-secondary is-disabled">Next</span>
    {% endif %}
</nav>
{% endif %}
